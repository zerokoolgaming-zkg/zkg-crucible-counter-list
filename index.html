<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ZKG Crucible Planner</title>
  <link rel="stylesheet" href="style.css"/>
  <script>window.API_URL="https://script.google.com/macros/s/AKfycbxBBpP4u__o5K0n8NfkUtB1ZfH3pSn6YLSV9MHGACX_9JZvecVWmolA3_WQYugJOlbajw/exec";</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="emblem.png" alt="ZKG" class="emblem" onerror="this.style.display='none'"/>
    <h1>ZKG Crucible Planner</h1>
  </div>
  <div class="actions">
    <a class="btn btn-donate" href="https://streamelements.com/zerokoolgamer-4649/tip" target="_blank" rel="noopener">Donate to ZKG</a>
  </div>
</header>

<main class="container">
  <section class="filters">
    <div class="row">
      <div class="dropdown-block">
        <label>Team (optional)</label>
        <select id="teamSelect"></select>
        <div class="preview"><div class="missing-ph">TEAM</div></div>
      </div>
      <div class="dropdown-block">
        <label>Team Member 1</label>
        <select class="charSelect"></select>
        <div class="preview"><img/><div class="missing-ph">?</div></div>
      </div>
      <div class="dropdown-block">
        <label>Team Member 2</label>
        <select class="charSelect"></select>
        <div class="preview"><img/><div class="missing-ph">?</div></div>
      </div>
      <div class="dropdown-block">
        <label>Team Member 3</label>
        <select class="charSelect"></select>
        <div class="preview"><img/><div class="missing-ph">?</div></div>
      </div>
      <div class="dropdown-block">
        <label>Team Member 4</label>
        <select class="charSelect"></select>
        <div class="preview"><img/><div class="missing-ph">?</div></div>
      </div>
      <div class="dropdown-block">
        <label>Team Member 5</label>
        <select class="charSelect"></select>
        <div class="preview"><img/><div class="missing-ph">?</div></div>
      </div>
    </div>
    <div class="actions-inline">
      <button id="resetBtn" class="btn">Reset</button>
      <span id="autoHint" class="hint">Counters auto‑run when 5 members are selected.</span>
    </div>
    <div id="loadingLine" class="searching hidden">Searching…</div>
  </section>

  <h2 class="results-title">
    Results
    <a class="discord-link" href="https://discord.gg/c23YXnUWb6" target="_blank" rel="noopener">
      <span>Submit your Crucible Counters to my <strong>Discord</strong></span>
    </a>
  </h2>

  <section id="result" class="results muted">Choose exactly 5 characters to search.</section>
</main>

<footer class="foot">
  <a href="diagnostics.html" target="_blank" rel="noopener">Diagnostics</a>
</footer>

<script src="script.js"></script>
</body>
</html>
